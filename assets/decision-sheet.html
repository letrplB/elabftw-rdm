<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision sheet</title>
<!--
  elabftw-rdm decision sheet — TEMPLATE.
  The agent copies this file into the lab's dossier (sheets/NN-<topic>.html)
  and replaces ONLY the JSON inside <script id="sheet-data">. Everything else
  is the renderer: self-contained, no network, works from file://.
  Data shape: references/decision-sheets.md.
-->
<style>
  :root {
    --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e0d8;
    --accent: #2f5d8a; --accent-soft: #e6eef6; --good: #2e7d4f; --good-soft: #e5f2ea;
    --warn: #a3620a; --warn-soft: #fbf0dc; --bad: #a33a2a; --bad-soft: #f8e4e0;
    --lane: #f3f1ec; --radius: 10px; --on-accent: #ffffff;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a09e97; --line: #34332f;
      --accent: #7fb0e0; --accent-soft: #1d2d3d; --good: #6cc592; --good-soft: #17301f;
      --warn: #e2a64b; --warn-soft: #34270f; --bad: #ec8c7c; --bad-soft: #3a1c17; --lane: #242422; --on-accent: #0e1a26;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font); }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 24px 96px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 6px 0 10px; letter-spacing: -0.01em; }
  h2 { font-size: 19px; margin: 0 0 6px; }
  h3 { font-size: 16px; margin: 0 0 4px; }
  p { margin: 0 0 10px; }
  code { font: 0.9em var(--mono); background: var(--lane); padding: 1px 5px; border-radius: 4px; }
  .eyebrow { color: var(--muted); font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; }
  .lede { font-size: 17px; color: var(--ink); max-width: 760px; }
  .muted { color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; margin: 18px 0; }
  .caption { color: var(--muted); font-size: 14px; margin-top: 8px; }

  /* phase stepper */
  .stepper { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 4px; padding: 0; list-style: none; }
  .stepper li { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--panel); }
  .stepper li.done { color: var(--good); border-color: var(--good); }
  .stepper li.now { color: var(--on-accent); background: var(--accent); border-color: var(--accent); font-weight: 600; }

  /* summary bar */
  .summary { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
             border-bottom: 1px solid var(--line); margin: 0 -24px; padding: 10px 24px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .summary .count { font-weight: 600; }
  .bar { flex: 1; min-width: 120px; height: 6px; background: var(--lane); border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--good); width: 0; transition: width .2s; }
  button { font: inherit; font-size: 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .donehint { font-size: 14px; margin: 8px 0 0; }
  .summary .actions { display: flex; gap: 8px; flex-wrap: nowrap; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* learned list */
  .learned li { margin-bottom: 4px; }

  /* decisions */
  .decision { border-left: 4px solid var(--line); }
  .decision.answered { border-left-color: var(--good); }
  .decision .qid { font: 600 12px var(--mono); color: var(--muted); margin-right: 6px; }
  .decision .why { color: var(--muted); font-size: 15px; }
  .options { display: grid; gap: 10px; margin: 12px 0 10px; }
  .opt { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; background: var(--panel); }
  .opt:hover { border-color: var(--accent); }
  .opt input { margin-top: 4px; accent-color: var(--accent); }
  .opt.checked { border-color: var(--accent); background: var(--accent-soft); }
  .opt .lbl { font-weight: 600; }
  .opt .rec { display: inline-block; font-size: 12px; font-weight: 600; color: var(--good); background: var(--good-soft); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 1px; }
  .opt .detail { font-size: 15px; margin-top: 2px; }
  .opt .cons { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .opt .cons b { color: var(--ink); font-weight: 600; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--accent); font-size: 14px; }
  textarea { width: 100%; min-height: 54px; font: 14px var(--font); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg); color: var(--ink); resize: vertical; }

  /* notes */
  .note { border-left: 4px solid var(--accent); }
  .note.warn { border-left-color: var(--warn); background: var(--warn-soft); }
  .note.good { border-left-color: var(--good); background: var(--good-soft); }
  .note.bad { border-left-color: var(--bad); background: var(--bad-soft); }

  /* tables */
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
  tr.hl td { background: var(--accent-soft); }

  /* storyboard */
  .story { counter-reset: step; display: grid; gap: 10px; margin-top: 10px; }
  .story .st { display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
  .story .st::before { counter-increment: step; content: counter(step); width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
  .story .who { font-weight: 600; }
  .story .elab { font-size: 14px; color: var(--muted); }

  /* diagram */
  .diagram { overflow-x: auto; margin-top: 8px; }
  .diagram svg { display: block; max-width: 100%; height: auto; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid var(--muted); }

  /* export */
  #export { display: none; }
  #export.show { display: block; }
  #export pre { white-space: pre-wrap; font: 13px/1.5 var(--mono); background: var(--lane); border-radius: 8px; padding: 12px; max-height: 360px; overflow: auto; }

  @media print {
    .summary, button, #export { display: none !important; }
    .panel { break-inside: avoid; }
    details { display: block; }
  }
</style>
</head>
<body>
<main id="app"></main>

<!-- ===== The agent replaces ONLY this JSON block. ===== -->
<script type="application/json" id="sheet-data">
{
  "lab": "Acme Catalysis Group",
  "lang": "en",
  "sheet": "02-entity-model",
  "title": "How your work maps into elabFTW",
  "date": "2026-11-06",
  "phase": { "current": 3, "names": ["Survey", "Your workflow", "What becomes what", "Fields", "Tags & links", "Checks", "Hand-over"] },
  "intro": "Below is the structure I propose, built from what you told me. Look at the picture first, then make the **three decisions** — each has my recommendation pre-marked. When you are done, write **done** in the chat — or, outside the Claude app, press **Copy my answers** and paste the result.",
  "learned": [
    "You make catalyst **batches** and split each into portions for XRD, BET and TEM.",
    "Your recipes change slowly (a few times per year) and you want to know which version a batch was made with.",
    "Today, projects are written into titles (\"PtAl-scr-04\"), so you cannot list all work of one project."
  ],
  "sections": [
    {
      "type": "diagram",
      "title": "The proposed structure",
      "caption": "Boxes are things in elabFTW; arrows are the links the assistant will set for you. Resources persist and are reused; experiments are dated, one-time activities.",
      "lanes": [
        { "id": "res", "label": "Resources — reusable" },
        { "id": "exp", "label": "Experiments — one-time" },
        { "id": "out", "label": "Resources — what you produce" }
      ],
      "nodes": [
        { "id": "recipe", "lane": "res", "label": "Recipe", "sub": "versioned: v1, v2 …" },
        { "id": "sop", "lane": "res", "label": "Measurement SOP", "sub": "one per method" },
        { "id": "instr", "lane": "res", "label": "Instrument", "sub": "XRD, BET, TEM" },
        { "id": "synth", "lane": "exp", "label": "Synthesis run", "sub": "template: Synthesis" },
        { "id": "ana", "lane": "exp", "label": "Analysis", "sub": "template per method" },
        { "id": "batch", "lane": "out", "label": "Batch passport", "sub": "one page per batch", "tone": "accent" }
      ],
      "edges": [
        { "from": "synth", "to": "recipe", "label": "follows" },
        { "from": "synth", "to": "batch", "label": "produces" },
        { "from": "ana", "to": "batch", "label": "measures" },
        { "from": "ana", "to": "sop", "label": "follows" },
        { "from": "ana", "to": "instr", "label": "on" },
        { "from": "batch", "to": "ana", "label": "current result", "dashed": true }
      ]
    },
    {
      "type": "decision",
      "id": "D1",
      "header": "Batch page",
      "title": "Should every batch get its own page (a \"passport\")?",
      "why": "elabFTW cannot collect \"all analyses of batch 42\" by itself. A passport page is where the assistant keeps that overview for you.",
      "options": [
        { "key": "A", "label": "Yes — one passport per batch", "recommended": true,
          "detail": "Each batch is a resource with its identity, who made it, and links to its current XRD/BET/TEM results.",
          "consequence": "**Daily cost:** none — the assistant creates it with the synthesis run. **Gain:** one click from a batch to all its results." },
        { "key": "B", "label": "No — results stay inside the synthesis entry",
          "detail": "Fewer pages, but analyses of the same batch are scattered across entries.",
          "consequence": "**Later cost:** comparing batches needs a manual search every time." }
      ]
    },
    {
      "type": "decision",
      "id": "D2",
      "header": "Recipes",
      "title": "How should recipe changes be recorded?",
      "why": "You want to know which recipe version a batch was made with, even after the recipe changes.",
      "options": [
        { "key": "A", "label": "New resource per version, old one marked superseded", "recommended": true,
          "detail": "\"Recipe Pt/Al₂O₃ v2\" is a new page linked to v1. Runs link to exactly the version they followed.",
          "consequence": "**Gain:** history is exact and nothing is overwritten." },
        { "key": "B", "label": "Edit the recipe in place",
          "detail": "One page per recipe; the edit history holds old versions.",
          "consequence": "**Risk:** elabFTW keeps history of the text only, not of the structured fields — old parameter values can be lost." }
      ]
    },
    {
      "type": "decision",
      "id": "D3",
      "header": "Methods",
      "title": "Which methods need their own analysis template now?",
      "why": "Each template pre-fills the fields a measurement needs. Start with the ones you run weekly; others can follow.",
      "multi": true,
      "options": [
        { "key": "xrd", "label": "XRD", "recommended": true, "detail": "Weekly, all batches." },
        { "key": "bet", "label": "BET / physisorption", "recommended": true, "detail": "Weekly, all batches." },
        { "key": "tem", "label": "TEM", "detail": "Monthly, selected batches — a generic analysis template may be enough." },
        { "key": "tpd", "label": "TPD", "detail": "Rare." }
      ]
    },
    {
      "type": "storyboard",
      "title": "What a normal week looks like with this setup",
      "steps": [
        { "who": "Anna", "do": "asks the assistant to start a synthesis from Recipe v2.", "elab": "→ experiment from template \"Synthesis\", linked to Recipe v2, tagged project:screening" },
        { "who": "Assistant", "do": "creates the batch passport LOT-2026-042 and links it.", "elab": "→ resource \"Batch\", produced_by_run = the synthesis" },
        { "who": "Ben", "do": "records the BET measurement.", "elab": "→ experiment from template \"BET\", links the batch; passport now points to it as current BET result" }
      ]
    },
    {
      "type": "table",
      "title": "What gets created in elabFTW (after your approval)",
      "columns": ["Kind", "Name", "Why"],
      "rows": [
        ["Resource template", "Recipe", "versioned reusable procedure"],
        ["Resource template", "Batch", "the passport"],
        ["Experiment template", "Synthesis", "pre-filled run fields"],
        ["Experiment template", "XRD, BET", "per decision D3"]
      ],
      "highlight": [1]
    },
    {
      "type": "note",
      "tone": "info",
      "title": "Nothing is changed yet",
      "body": "This sheet is a proposal. The assistant only creates things in elabFTW after you approve the final plan."
    }
  ]
}
</script>

<script>
(function () {
  "use strict";
  var data;
  try { data = JSON.parse(document.getElementById("sheet-data").textContent); }
  catch (e) { document.getElementById("app").innerHTML = "<p>Sheet data is not valid JSON: " + esc(String(e)) + "</p>"; return; }

  var KEY = "elabftw-rdm:" + (data.lab || "") + ":" + (data.sheet || "");
  // UI strings. Sheet content comes from the data; only the renderer's own labels live here.
  var STR = {
    en: { accept: "Accept all recommendations", copy: "Copy my answers", learned: "What I understood so far",
          learnedHint: "My recommendations are based on this. If something is wrong, say so in the notes — that matters more than any single decision.",
          answers: "Your answers", copied: "Copied to the clipboard. If that failed, select the text below and copy it. Paste it into the chat.",
          multi: "Pick all that apply.", rec: "Recommended", more: "Background", notes: "Notes, doubts, or a different idea (optional)",
          decided: "decided", of: "of", done: "Working in the Claude app? Just write “done” in the chat — Claude reads your answers from this page.",
          legend: ["thing in elabFTW", "central page", "— link set by the assistant", "- - - pointer to the current result"] },
    de: { accept: "Alle Empfehlungen übernehmen", copy: "Antworten kopieren", learned: "Was ich bisher verstanden habe",
          learnedHint: "Darauf beruhen meine Empfehlungen. Wenn etwas nicht stimmt, schreibt es in die Anmerkungen – das ist wichtiger als jede einzelne Entscheidung.",
          answers: "Eure Antworten", copied: "In die Zwischenablage kopiert. Falls das nicht geklappt hat, markiert den Text unten und kopiert ihn. Dann in den Chat einfügen.",
          multi: "Mehrfachauswahl möglich.", rec: "Empfohlen", more: "Hintergrund", notes: "Anmerkungen, Zweifel oder eine andere Idee (optional)",
          decided: "entschieden", of: "von", done: "In der Claude-App? Schreibt einfach „fertig“ in den Chat – Claude liest eure Antworten direkt aus dieser Seite.",
          legend: ["Eintrag in eLabFTW", "zentrale Seite", "— Verknüpfung, die der Assistent setzt", "- - - Verweis auf das aktuelle Ergebnis"] }
  };
  var T = STR[data.lang] || STR.en;
  var state = load();
  var app = document.getElementById("app");
  document.title = (data.title || "Decision sheet") + " — " + (data.lab || "");

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]; }); }
  function md(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`(.+?)`/g, "<code>$1</code>").replace(/\*(.+?)\*/g, "<em>$1</em>"); }
  function el(tag, cls, html) { var n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* file:// in some browsers */ } }

  var decisions = (data.sections || []).filter(function (s) { return s.type === "decision"; });

  // ---------- header ----------
  var head = el("header");
  head.appendChild(el("div", "eyebrow", esc(data.lab) + (data.date ? " · " + esc(data.date) : "") + (data.sheet ? " · sheet " + esc(data.sheet) : "")));
  head.appendChild(el("h1", null, esc(data.title)));
  if (data.phase && data.phase.names) {
    var ul = el("ul", "stepper");
    data.phase.names.forEach(function (n, i) {
      var li = el("li", (i + 1 < data.phase.current ? "done" : i + 1 === data.phase.current ? "now" : ""), (i + 1) + " · " + esc(n));
      ul.appendChild(li);
    });
    head.appendChild(ul);
  }
  if (data.intro) head.appendChild(el("p", "lede", md(data.intro)));
  app.appendChild(head);

  // ---------- sticky summary ----------
  if (decisions.length) {
    var sum = el("div", "summary");
    sum.innerHTML = '<span class="count" id="count"></span><div class="bar"><span id="bar"></span></div>';
    var bRec = el("button", null, T.accept);
    bRec.type = "button";
    bRec.onclick = function () {
      decisions.forEach(function (d) {
        var rec = d.options.filter(function (o) { return o.recommended; }).map(function (o) { return o.key; });
        if (rec.length && !(state[d.id] && state[d.id].pick && state[d.id].pick.length)) { state[d.id] = state[d.id] || {}; state[d.id].pick = d.multi ? rec : [rec[0]]; }
      });
      save(); render();
    };
    var bCopy = el("button", "primary", T.copy);
    bCopy.type = "button";
    bCopy.onclick = exportAnswers;
    var act = el("div", "actions"); act.appendChild(bRec); act.appendChild(bCopy); sum.appendChild(act);
    app.appendChild(sum);
    app.appendChild(el("p", "muted donehint", esc(T.done)));
  }

  if (data.learned && data.learned.length) {
    var p = el("section", "panel");
    p.appendChild(el("h2", null, T.learned));
    p.appendChild(el("p", "muted", T.learnedHint));
    var l = el("ul", "learned");
    data.learned.forEach(function (x) { l.appendChild(el("li", null, md(x))); });
    p.appendChild(l);
    app.appendChild(p);
  }

  var container = el("div");
  app.appendChild(container);

  var exp = el("section", "panel");
  exp.id = "export";
  exp.innerHTML = "<h2>" + esc(T.answers) + '</h2><p class="muted">' + esc(T.copied) + '</p><pre id="exporttext"></pre>';
  app.appendChild(exp);

  // ---------- sections ----------
  function render() {
    container.innerHTML = "";
    (data.sections || []).forEach(function (s) {
      var fn = R[s.type];
      if (fn) container.appendChild(fn(s));
    });
    updateSummary();
  }

  var R = {
    decision: function (d) {
      var st = state[d.id] || {};
      var picked = st.pick || [];
      var box = el("section", "panel decision" + (picked.length ? " answered" : ""));
      var fs = el("fieldset"); fs.style.border = "0"; fs.style.padding = "0"; fs.style.margin = "0";
      var lg = el("legend", null, '<h2><span class="qid">' + esc(d.id) + (d.header ? " · " + esc(d.header) : "") + "</span><br>" + md(d.title) + "</h2>");
      lg.style.padding = "0";
      fs.appendChild(lg);
      if (d.why) fs.appendChild(el("p", "why", md(d.why)));
      if (d.multi) fs.appendChild(el("p", "muted", T.multi));
      var opts = el("div", "options");
      d.options.forEach(function (o) {
        var lab = el("label", "opt" + (picked.indexOf(o.key) >= 0 ? " checked" : ""));
        var inp = document.createElement("input");
        inp.type = d.multi ? "checkbox" : "radio"; inp.name = d.id; inp.value = o.key; inp.checked = picked.indexOf(o.key) >= 0;
        inp.onchange = function () {
          var cur = (state[d.id] && state[d.id].pick) || [];
          if (d.multi) { cur = cur.filter(function (k) { return k !== o.key; }); if (inp.checked) cur.push(o.key); }
          else cur = [o.key];
          state[d.id] = state[d.id] || {}; state[d.id].pick = cur; save(); render();
        };
        lab.appendChild(inp);
        var body = el("div");
        body.innerHTML = '<span class="lbl">' + md(o.label) + "</span>" + (o.recommended ? '<span class="rec">' + esc(T.rec) + "</span>" : "") +
          (o.detail ? '<div class="detail">' + md(o.detail) + "</div>" : "") +
          (o.consequence ? '<div class="cons">' + md(o.consequence) + "</div>" : "");
        lab.appendChild(body);
        opts.appendChild(lab);
      });
      fs.appendChild(opts);
      if (d.more) { var dt = el("details"); dt.innerHTML = "<summary>" + esc(T.more) + "</summary><p>" + md(d.more) + "</p>"; fs.appendChild(dt); }
      var ta = document.createElement("textarea");
      ta.placeholder = T.notes;
      ta.value = st.note || "";
      ta.setAttribute("aria-label", "Notes for " + d.id);
      ta.oninput = function () { state[d.id] = state[d.id] || {}; state[d.id].note = ta.value; save(); };
      fs.appendChild(ta);
      box.appendChild(fs);
      return box;
    },
    note: function (n) {
      var box = el("section", "panel note " + (n.tone || "info"));
      if (n.title) box.appendChild(el("h3", null, md(n.title)));
      box.appendChild(el("p", null, md(n.body)));
      return box;
    },
    table: function (t) {
      var box = el("section", "panel");
      if (t.title) box.appendChild(el("h2", null, md(t.title)));
      var wrap = el("div", "tablewrap");
      var hl = t.highlight || [];
      var h = "<table><thead><tr>" + t.columns.map(function (c) { return "<th>" + md(c) + "</th>"; }).join("") + "</tr></thead><tbody>";
      t.rows.forEach(function (r, i) { h += '<tr class="' + (hl.indexOf(i) >= 0 ? "hl" : "") + '">' + r.map(function (c) { return "<td>" + md(c) + "</td>"; }).join("") + "</tr>"; });
      wrap.innerHTML = h + "</tbody></table>";
      box.appendChild(wrap);
      if (t.caption) box.appendChild(el("p", "caption", md(t.caption)));
      return box;
    },
    list: function (t) {
      var box = el("section", "panel");
      if (t.title) box.appendChild(el("h2", null, md(t.title)));
      var u = el("ul");
      t.items.forEach(function (x) { u.appendChild(el("li", null, md(x))); });
      box.appendChild(u);
      return box;
    },
    storyboard: function (s) {
      var box = el("section", "panel");
      if (s.title) box.appendChild(el("h2", null, md(s.title)));
      var w = el("div", "story");
      s.steps.forEach(function (x) {
        w.appendChild(el("div", "st", "<div><span class=\"who\">" + md(x.who) + "</span> " + md(x.do) + (x.elab ? '<div class="elab">' + md(x.elab) + "</div>" : "") + "</div>"));
      });
      box.appendChild(w);
      return box;
    },
    diagram: function (g) {
      var box = el("section", "panel");
      if (g.title) box.appendChild(el("h2", null, md(g.title)));
      var d = el("div", "diagram");
      d.appendChild(diagram(g));
      box.appendChild(d);
      box.appendChild(el("div", "legend", "<span><i></i>" + esc(T.legend[0]) + '</span><span><i style="border-color:var(--accent);background:var(--accent-soft)"></i>' + esc(T.legend[1]) + "</span><span>" + esc(T.legend[2]) + "</span><span>" + esc(T.legend[3]) + "</span>"));
      if (g.caption) box.appendChild(el("p", "caption", md(g.caption)));
      return box;
    }
  };

  // ---------- diagram renderer (lanes = columns, deterministic layout) ----------
  function diagram(g) {
    var NS = "http://www.w3.org/2000/svg";
    var css = getComputedStyle(document.documentElement);
    function v(n) { return css.getPropertyValue(n).trim(); }
    var lanes = g.lanes || [{ id: "_", label: "" }];
    var LW = 210, GAP = 80, PADX = 16, TOP = 46, NH = 58, NG = 30, NW = 180;
    var laneIdx = {}; lanes.forEach(function (l, i) { laneIdx[l.id] = i; });
    var perLane = lanes.map(function () { return []; });
    g.nodes.forEach(function (n) { var i = laneIdx[n.lane] != null ? laneIdx[n.lane] : 0; perLane[i].push(n); });
    var maxN = Math.max.apply(null, perLane.map(function (a) { return a.length; }).concat([1]));
    var W = PADX * 2 + lanes.length * LW + (lanes.length - 1) * GAP;
    var H = TOP + maxN * (NH + NG) + 20;
    var pos = {};
    perLane.forEach(function (arr, li) {
      var x0 = PADX + li * (LW + GAP);
      var offset = ((maxN - arr.length) * (NH + NG)) / 2;
      arr.forEach(function (n, k) {
        pos[n.id] = { x: x0 + (LW - NW) / 2, y: TOP + offset + k * (NH + NG), w: NW, h: NH, lane: li };
      });
    });
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W); svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", (g.title || "diagram") + ": " + g.nodes.map(function (n) { return n.label; }).join(", "));
    function mk(tag, attrs, text) { var n = document.createElementNS(NS, tag); for (var k in attrs) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; svg.appendChild(n); return n; }
    var defs = mk("defs", {});
    defs.innerHTML = '<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + v("--muted") + '"/></marker>';
    lanes.forEach(function (l, i) {
      var x = PADX + i * (LW + GAP);
      mk("rect", { x: x, y: 8, width: LW, height: H - 16, rx: 12, fill: v("--lane") });
      mk("text", { x: x + LW / 2, y: 30, "text-anchor": "middle", "font-size": 13, "font-weight": 600, fill: v("--muted"), "font-family": v("--font") }, l.label);
    });
    var labels = [];
    // parallel edges between the same pair are fanned out so lines and labels never overlap
    var pairN = {}, pairI = {};
    (g.edges || []).forEach(function (e) { var k = [e.from, e.to].sort().join("|"); pairN[k] = (pairN[k] || 0) + 1; });
    (g.edges || []).forEach(function (e) {
      var a = pos[e.from], b = pos[e.to]; if (!a || !b) return;
      var k = [e.from, e.to].sort().join("|"); var i = pairI[k] = (pairI[k] == null ? 0 : pairI[k] + 1);
      var off = (i - (pairN[k] - 1) / 2) * 18;
      var x1, y1, x2, y2, d;
      y1 = a.y + a.h / 2 + off; y2 = b.y + b.h / 2 + off;
      if (a.lane === b.lane) {
        x1 = a.x + a.w; x2 = b.x + b.w; var bulge = 46;
        d = "M" + x1 + "," + y1 + " C" + (x1 + bulge) + "," + y1 + " " + (x2 + bulge) + "," + y2 + " " + x2 + "," + y2;
        labels.push({ x: Math.max(x1, x2) + bulge * 0.75, y: (y1 + y2) / 2, t: e.label });
      } else {
        var fwd = b.lane > a.lane;
        x1 = fwd ? a.x + a.w : a.x; x2 = fwd ? b.x : b.x + b.w;
        var mx = (x1 + x2) / 2;
        d = "M" + x1 + "," + y1 + " C" + mx + "," + y1 + " " + mx + "," + y2 + " " + x2 + "," + y2;
        labels.push({ x: mx, y: (y1 + y2) / 2 + (off > 0 ? 14 : off < 0 ? -6 : -6), t: e.label });
      }
      mk("path", { d: d, fill: "none", stroke: v("--muted"), "stroke-width": 1.6, "marker-end": "url(#arr)", "stroke-dasharray": e.dashed ? "5 4" : "" });
    });
    g.nodes.forEach(function (n) {
      var p = pos[n.id]; var acc = n.tone === "accent";
      var r = mk("rect", { x: p.x, y: p.y, width: p.w, height: p.h, rx: 9, fill: acc ? v("--accent-soft") : v("--panel"), stroke: acc ? v("--accent") : v("--line"), "stroke-width": acc ? 2 : 1.5 });
      if (n.note) { var t = document.createElementNS(NS, "title"); t.textContent = n.note; r.appendChild(t); }
      mk("text", { x: p.x + p.w / 2, y: p.y + (n.sub ? 25 : 34), "text-anchor": "middle", "font-size": 15, "font-weight": 600, fill: v("--ink"), "font-family": v("--font") }, n.label);
      if (n.sub) mk("text", { x: p.x + p.w / 2, y: p.y + 44, "text-anchor": "middle", "font-size": 12.5, fill: v("--muted"), "font-family": v("--font") }, n.sub);
    });
    labels.forEach(function (L) {
      if (!L.t) return;
      mk("text", { x: L.x, y: L.y, "text-anchor": "middle", "font-size": 12.5, fill: v("--ink"), "font-family": v("--font"), stroke: v("--panel"), "stroke-width": 5, "paint-order": "stroke", "stroke-linejoin": "round" }, L.t);
    });
    return svg;
  }

  // ---------- summary + export ----------
  function updateSummary() {
    var c = document.getElementById("count"); if (!c) return;
    var n = decisions.filter(function (d) { return state[d.id] && state[d.id].pick && state[d.id].pick.length; }).length;
    c.textContent = n + " " + T.of + " " + decisions.length + " " + T.decided;
    document.getElementById("bar").style.width = (decisions.length ? (100 * n / decisions.length) : 0) + "%";
  }

  // Machine-readable answers for an agent driving the browser: window.sheetAnswers()
  function answers() {
    var ds = decisions.map(function (d) {
      var st = state[d.id] || {}; var pick = st.pick || [];
      return {
        id: d.id, header: d.header || "", question: d.title,
        pick: pick.map(function (k) {
          var o = d.options.filter(function (x) { return x.key === k; })[0] || {};
          return { key: k, label: (o.label || "").replace(/\*\*/g, ""), recommended: !!o.recommended };
        }),
        note: (st.note || "").trim(),
        open: pick.length === 0
      };
    });
    return { lab: data.lab || "", sheet: data.sheet || "", readAt: new Date().toISOString(),
             complete: ds.every(function (d) { return !d.open; }), decisions: ds };
  }
  window.sheetAnswers = answers;

  function exportAnswers() {
    var lines = ["DECISION SHEET " + (data.sheet || "") + " — " + (data.lab || "") + " — answered " + new Date().toISOString().slice(0, 10)];
    decisions.forEach(function (d) {
      var st = state[d.id] || {}; var pick = st.pick || [];
      var labels = pick.map(function (k) {
        var o = d.options.filter(function (x) { return x.key === k; })[0];
        return k + (o ? ' "' + o.label.replace(/\*\*/g, "") + '"' + (o.recommended ? " (recommended)" : " (NOT the recommendation)") : "");
      });
      lines.push(d.id + (d.header ? " " + d.header : "") + ": " + (labels.length ? labels.join("; ") : "OPEN — not decided"));
      if (st.note && st.note.trim()) lines.push("   note: " + st.note.trim().replace(/\n+/g, " / "));
    });
    var txt = lines.join("\n");
    document.getElementById("exporttext").textContent = txt;
    document.getElementById("export").classList.add("show");
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).catch(function () {}); }
    document.getElementById("export").scrollIntoView({ behavior: "smooth" });
  }

  render();
})();
</script>
</body>
</html>
